name: QA Automation CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 1'
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ensure browsers are installed
      run: python -m playwright install --with-deps

    - name: Run All Tests
      env:
        UI_BASE_URL: ${{ secrets.UI_BASE_URL }}
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
        SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
        SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
        VARIANT_ID: ${{ secrets.VARIANT_ID }}
      
      run: pytest --html=reports/report.html --self-contained-html

    - name: Upload Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-report
        path: reports/
        retention-days: 30 

    - name: Notify to Slack
      if: always()  # 성공/실패 상관없이 항상 알림 전송
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_TITLE: "QA Automation Test Results"
        SLACK_MESSAGE: "테스트 실행 완료! GitHub Actions에서 리포트를 확인하세요."
        SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
        SLACK_USERNAME: "QA 자동화 봇"